[defaults]
inventory = inventory.yml
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml
# Wyłączenie weryfikacji kluczy hostów upraszcza pracę agentów/runnerów w laboratorium.
# W środowisku produkcyjnym należy zamiast tego utrzymywać plik known_hosts.
host_key_checking = False

[ssh_connection]
pipelining = True
